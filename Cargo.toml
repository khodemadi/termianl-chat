[package]
name = "lan-terminal-chat"
version = "0.2.0"
edition = "2021"
description = "A Vim-like LAN terminal chat TUI."
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.29"
hostname = "0.4"
rand = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

