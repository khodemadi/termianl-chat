[package]
name = "lan-terminal-chat"
version = "0.3.0-hotfix"
edition = "2021"
description = "A Vim-like LAN terminal chat TUI with RTL display, encrypted messages and file transfer."
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.11"
crossterm = "0.29"
hostname = "0.4"
rand = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
unicode-bidi = "0.3.18"
x25519-dalek = "3.0"
